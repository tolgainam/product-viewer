<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@tolgainam/product-viewer — device frames</title>
<meta name="description" content="The live demo inside phone and tablet sized frames, for checking the mobile layout on a desktop browser.">
<style>
  html,body{margin:0;background:#111;color:#ccc;font-family:"Inter","Roboto","Helvetica","Arial",sans-serif}
  main{display:flex;gap:32px;padding:32px;align-items:flex-start;flex-wrap:wrap}
  figure{margin:0}
  figcaption{font-size:12px;margin-bottom:8px;opacity:.7}
  iframe{border:1px solid #333;border-radius:12px;background:#000;display:block}
</style></head>
<body><main>
  <figure><figcaption>Phone · 390 × 844</figcaption><iframe src="./demo.html" width="390" height="844" title="Phone"></iframe></figure>
  <figure><figcaption>Small phone · 320 × 640</figcaption><iframe src="./demo.html" width="320" height="640" title="Small phone"></iframe></figure>
  <figure><figcaption>Tablet · 820 × 1000</figcaption><iframe src="./demo.html" width="820" height="1000" title="Tablet"></iframe></figure>
</main></body></html>
